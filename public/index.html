<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Hoş geldin!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  </head>
<!--Müzik bölümü-->
  <body>
    <audio autoplay loop>
        <source src="https://docs.google.com/uc?export=open&id=1o8XooqXIhA2bVrPG81mT2MKQV04APu9J" type="audio/mpeg">
        Tarayıcınız müzik çalmasını desteklemiyor.
      </audio>
    <div class="container">
      <h1>Nasılsın?</h1>
      <form>
        <label for="name">Adın?</label>
        <h4>(İsteğe bağlı)</h4>
        <input type="text" id="name" name="name">
        <label for="emotion">Bugün nasıl hissediyorsun?</label>
        <select id="emotion" name="emotion">
          <option value="Mutlu">Mutlu</option>
          <option value="Üzgün">Üzgün</option>
          <option value="Öfkeli">Öfkeli</option>
          <option value="Kaygılı">Kaygılı</option>
          <option value="Heyecanlı">Heyecanlı</option>
        </select>
        <label for="details">Neden böyle hissediyorsun?</label>
        <textarea id="details" name="details"></textarea>
        <button type="submit">Gönder</button>
      </form>
      <div class="music-container">
        <button id="music-toggler">
          Müziği Durdur
        </button>
      </div>
      <h2>Diğerlerinin hissettikleri</h2>
      <ul id="emotions">
        <!-- Başkalarının paylaştığı duygular burada görünecek -->
      </ul>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.4.3/purify.min.js" integrity="sha512-aV+loL/X8C+ImtcnZgoBD3DizB/H0rG2g/f8qDaxJWn+kQ8h3a3629f17+mdqAc2K/z1/f44Y+fD/OmQN+i6g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
    <script>
        const music = document.querySelector('audio');
        
        document.querySelector('#music-toggler').addEventListener('click', (event) => {
          if(music.paused) {
            music.play();
            event.target.innerText = 'Müziği Durdur';
            return;
          }

          music.pause();
          event.target.innerText = 'Müziği Başlat';
        })
      </script>

  </body>
</html>
